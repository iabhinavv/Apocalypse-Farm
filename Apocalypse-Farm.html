<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apocalypse Farm — A Self-Sustaining Farming Eco-System</title>
<meta name="description" content="Plan a self-sufficient integrated farm in India. Enter your land area and state, get a phased build order, and watch the farm rise as you tick off each step.">
<style>
/* --------------------------------------------------------------------------
   Apocalypse Farm -- a field manual with a living map in it.
   Warm parchment, hard edges, chunky borders. Nothing rounded, nothing glossy.
   -------------------------------------------------------------------------- */

:root {
  --paper: #f4ecd9;
  --paper-2: #eae0c6;
  --card: #fbf6e8;
  --card-2: #f4ecd8;
  --ink: #3a2b1c;
  --ink-soft: #6d5a44;
  --ink-faint: #94826a;
  --rule: #d5c39c;
  --edge: #a8865c;
  --edge-dark: #6d5336;
  --green: #4f8a3d;
  --green-deep: #2f5c2a;
  --gold: #b8791b;
  --rust: #a2452f;
  --sky: #35708f;
  --shadow: rgba(60, 42, 24, .28);

  --mono: "SF Mono", "Menlo", "Consolas", "Roboto Mono", monospace;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}

/* Light throughout. A dark variant made the ruler gutter and the ground
   around the farm read as near-black, which fought the pixel art. */


* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; color: inherit; cursor: pointer; }

.mono { font-family: var(--mono); font-size: .86em; letter-spacing: -.01em; }

.smallcaps {
  font-variant: small-caps;
  letter-spacing: .12em;
  text-transform: lowercase;
  font-size: .78rem;
  color: var(--ink-faint);
}

/* --- chrome ------------------------------------------------------------- */

header.top {
  background: var(--edge-dark);
  border-bottom: 3px solid var(--edge);
  color: #f0e2c0;
  padding: 10px 20px;
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 40;
}

header.top h1 {
  margin: 0;
  font-size: 1.12rem;
  letter-spacing: .06em;
  font-weight: 700;
}

header.top .sub {
  font-size: .78rem;
  color: #c4b189;
  font-variant: small-caps;
  letter-spacing: .1em;
}

header.top .spacer { flex: 1; }

header.top .ctx {
  font-family: var(--mono);
  font-size: .78rem;
  color: #e5d2a6;
  background: rgba(0, 0, 0, .25);
  border: 1px solid #7d6039;
  padding: 3px 10px;
}

.linkbtn {
  background: none;
  border: 1px solid #7d6039;
  color: #e5d2a6;
  font-size: .74rem;
  font-variant: small-caps;
  letter-spacing: .1em;
  padding: 3px 12px;
}

.linkbtn:hover { background: rgba(255, 255, 255, .08); }

/* --- setup screen ------------------------------------------------------- */

.setup {
  max-width: 1000px;
  margin: 0 auto;
  padding: 34px 20px 80px;
}

.setup h2 {
  font-size: 2rem;
  margin: 0 0 6px;
  letter-spacing: -.01em;
}

.setup .lede {
  color: var(--ink-soft);
  max-width: 62ch;
  margin: 0 0 30px;
}

.panel {
  background: var(--card);
  border: 2px solid var(--edge);
  box-shadow: 4px 4px 0 var(--shadow);
  padding: 20px 22px;
  margin-bottom: 24px;
}

.panel > h3 {
  margin: 0 0 4px;
  font-size: 1.02rem;
  letter-spacing: .04em;
}

.panel > .hint {
  margin: 0 0 16px;
  color: var(--ink-soft);
  font-size: .9rem;
}

.regionrow { margin-bottom: 16px; }

.regionrow > .smallcaps {
  display: block;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 3px;
  margin-bottom: 9px;
}

.states {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
  gap: 7px;
}

.statebtn {
  text-align: left;
  background: var(--card-2);
  border: 1px solid var(--rule);
  padding: 7px 10px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  transition: transform .08s, background .12s;
}

.statebtn:hover { background: var(--paper-2); transform: translate(-1px, -1px); }

.statebtn[aria-pressed="true"] {
  background: var(--green-deep);
  border-color: var(--green-deep);
  color: #f2e8cd;
  box-shadow: 3px 3px 0 var(--shadow);
}

.statebtn b { font-size: .95rem; font-weight: 600; }

.statebtn small {
  font-size: .72rem;
  color: var(--ink-faint);
  font-family: var(--mono);
}

.statebtn[aria-pressed="true"] small { color: #cbdcbb; }

.tag {
  display: inline-block;
  font-size: .66rem;
  font-variant: small-caps;
  letter-spacing: .09em;
  padding: 0 6px;
  border: 1px solid currentColor;
  margin-top: 3px;
  align-self: flex-start;
}

.tag.open { color: var(--green); }
.tag.caution { color: var(--gold); }
.tag.closed { color: var(--rust); }

.acreRow { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

.acreRow input[type=range] { flex: 1; min-width: 240px; accent-color: var(--green); }

.acreBig {
  font-family: var(--mono);
  font-size: 2.1rem;
  font-weight: 700;
  min-width: 4.6ch;
  text-align: right;
}

.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

.presets button {
  background: var(--card-2);
  border: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: .78rem;
  padding: 2px 10px;
}

.presets button:hover { background: var(--paper-2); }

.bigstart {
  width: 100%;
  background: var(--green-deep);
  color: #f4ecd4;
  border: 2px solid var(--edge-dark);
  box-shadow: 4px 4px 0 var(--shadow);
  font-size: 1.06rem;
  letter-spacing: .06em;
  font-variant: small-caps;
  padding: 13px;
}

.bigstart:hover { background: #3a6f31; }
.bigstart:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
.bigstart[disabled] { opacity: .4; cursor: not-allowed; }

/* --- main layout -------------------------------------------------------- */

.game { display: block; }

/* The board is the landing area: full width, with the guide beneath it. */
.mapcol {
  padding: 16px 20px 18px;
  border-bottom: 2px solid var(--edge);
  background: var(--paper-2);
  min-width: 0;
  overflow: hidden;
}

.mapcol > * { max-width: 1500px; margin-left: auto; margin-right: auto; }

/* meters, tally and the auto-build control share one row under the board */
.mapinfo {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 34px;
  align-items: flex-start;
  margin-top: 12px;
}

.mapinfo .meters { margin-top: 0; flex: 1 1 340px; min-width: 300px; max-width: 460px; }
.mapinfo .side { flex: 1 1 300px; min-width: 260px; }

.mapframe {
  border: 3px solid var(--edge-dark);
  box-shadow: 5px 5px 0 var(--shadow);
  background: var(--edge-dark);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  padding: 0;
}

.mapframe canvas { display: block; image-rendering: pixelated; }

.meters { margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }

.meter { display: grid; grid-template-columns: 8.5rem 1fr 3.2rem; gap: 9px; align-items: center; }

.meter .lab { font-variant: small-caps; letter-spacing: .08em; font-size: .8rem; color: var(--ink-soft); }

.meter .bar {
  height: 11px;
  background: var(--card-2);
  border: 1px solid var(--edge);
  position: relative;
  overflow: hidden;
}

.meter .bar i {
  display: block;
  height: 100%;
  background: var(--green);
  transition: width .45s cubic-bezier(.2, .8, .3, 1);
}

.meter .bar i.gold { background: var(--gold); }
.meter .bar i.sky { background: var(--sky); }
.meter .bar i.rust { background: var(--rust); }

.meter .val { font-family: var(--mono); font-size: .8rem; text-align: right; }

.credit {
  margin-top: 16px;
  font-size: .7rem;
  color: var(--ink-faint);
  line-height: 1.5;
  border-top: 1px solid var(--rule);
  padding-top: 9px;
}

/* --- right column ------------------------------------------------------- */

.plancol { padding: 0 0 90px; min-width: 0; }

.tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--edge);
  background: var(--paper-2);
  position: sticky;
  top: 47px;
  z-index: 30;
}

.tabs button {
  background: none;
  border: none;
  border-right: 1px solid var(--rule);
  padding: 11px 17px;
  font-variant: small-caps;
  letter-spacing: .1em;
  font-size: .84rem;
  color: var(--ink-soft);
}

.tabs button[aria-selected="true"] {
  background: var(--card);
  color: var(--ink);
  font-weight: 700;
  box-shadow: inset 0 -3px 0 var(--green-deep);
}

.tabbody { padding: 22px 26px 90px; max-width: 78ch; margin: 0 auto; }

.tabbody h3 { font-size: 1.3rem; margin: 0 0 4px; }
.tabbody h4 { font-size: 1.02rem; margin: 26px 0 6px; letter-spacing: .02em; }
.tabbody p { margin: 0 0 12px; }
.tabbody .lede { color: var(--ink-soft); margin-bottom: 22px; }

/* --- phases and steps --------------------------------------------------- */

.phase { margin-bottom: 34px; }

.phasehead {
  border-bottom: 2px solid var(--edge);
  padding-bottom: 6px;
  margin-bottom: 4px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.phasehead h4 { margin: 0; font-size: 1.14rem; }
.phasehead .year { font-variant: small-caps; letter-spacing: .12em; font-size: .78rem; color: var(--gold); font-weight: 700; }
.phasehead .count { margin-left: auto; font-family: var(--mono); font-size: .78rem; color: var(--ink-faint); }

.phaseblurb { color: var(--ink-soft); font-size: .92rem; margin: 8px 0 16px; }

.step {
  border: 1px solid var(--rule);
  border-left: 4px solid var(--rule);
  background: var(--card);
  margin-bottom: 9px;
  transition: border-color .2s, background .2s;
}

.step.done { border-left-color: var(--green); background: var(--card-2); }
.step.locked { opacity: .52; }

.stephead {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 11px 14px;
  cursor: pointer;
  width: 100%;
  background: none;
  border: none;
  text-align: left;
}

.tickbox {
  flex: none;
  width: 19px;
  height: 19px;
  border: 2px solid var(--edge);
  background: var(--paper);
  margin-top: 3px;
  display: grid;
  place-items: center;
  font-size: 13px;
  line-height: 1;
  color: transparent;
  font-family: var(--mono);
  font-weight: 700;
}

.step.done .tickbox { background: var(--green); border-color: var(--green-deep); color: #f4ecd4; }

.steptitle { flex: 1; min-width: 0; }
.steptitle b { font-weight: 600; font-size: 1rem; display: block; }
.step.done .steptitle b { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--ink-soft); }
.steptitle .meta { font-size: .76rem; color: var(--ink-faint); font-family: var(--mono); }

.stepbody { padding: 0 14px 15px 45px; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 0; }
.stepbody p { margin: 0 0 11px; font-size: .94rem; }
.stepbody p:last-child { margin-bottom: 0; }

.steplinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

.chip {
  background: var(--paper-2);
  border: 1px solid var(--rule);
  font-size: .76rem;
  padding: 2px 10px;
  font-variant: small-caps;
  letter-spacing: .06em;
}

.chip:hover { background: var(--green-deep); color: #f2e8cd; border-color: var(--green-deep); }

.costline {
  font-family: var(--mono);
  font-size: .78rem;
  color: var(--ink-soft);
  border-top: 1px dashed var(--rule);
  margin-top: 12px;
  padding-top: 8px;
}

.gatenote { font-size: .78rem; color: var(--rust); font-family: var(--mono); margin-top: 8px; }

/* --- tables and data ---------------------------------------------------- */

table.data { width: 100%; border-collapse: collapse; margin: 10px 0 20px; font-size: .9rem; }
table.data th, table.data td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data th { font-variant: small-caps; letter-spacing: .08em; font-size: .78rem; color: var(--ink-faint); font-weight: 400; }
table.data td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
table.data tr.total td { border-top: 2px solid var(--edge); border-bottom: none; font-weight: 700; }

.allocbar { display: flex; height: 26px; border: 2px solid var(--edge); margin: 6px 0 14px; overflow: hidden; }
.allocbar i { display: block; height: 100%; }

.callout {
  border-left: 4px solid var(--gold);
  background: var(--card-2);
  padding: 11px 15px;
  margin: 16px 0;
  font-size: .92rem;
}

.callout.warn { border-left-color: var(--rust); }
.callout.good { border-left-color: var(--green); }
.callout b { font-variant: small-caps; letter-spacing: .08em; }

/* --- guide index -------------------------------------------------------- */

.guidegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 7px; margin-bottom: 24px; }

.guidecard {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--rule);
  padding: 9px 12px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.guidecard:hover { background: var(--paper-2); border-color: var(--edge); }
/* sprites vary from 16x16 to a 48px tree -- pin the height so cards stay even */
.guidecard canvas { image-rendering: pixelated; flex: none; height: 30px; width: auto; }
.guidecard > div { min-width: 0; }
.guidecard b { display: block; font-weight: 600; font-size: .95rem; }
.guidecard small { color: var(--ink-faint); font-size: .74rem; font-family: var(--mono); }

/* --- slide-over guide --------------------------------------------------- */

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(30, 20, 10, .5);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}

.scrim.on { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(660px, 94vw);
  background: var(--card);
  border-left: 3px solid var(--edge);
  z-index: 61;
  transform: translateX(100%);
  transition: transform .26s cubic-bezier(.2, .8, .3, 1);
  display: flex;
  flex-direction: column;
}

.drawer.on { transform: none; }

.drawerhead {
  padding: 15px 22px;
  border-bottom: 2px solid var(--edge);
  background: var(--paper-2);
  display: flex;
  align-items: center;
  gap: 14px;
}

.drawerhead h3 { margin: 0; font-size: 1.24rem; }
.drawerhead .local { color: var(--ink-faint); font-size: .84rem; font-family: var(--mono); }
.drawerhead canvas { image-rendering: pixelated; height: 44px; width: auto; flex: none; }
.drawerhead .close { margin-left: auto; }

.drawerbody { overflow-y: auto; padding: 20px 24px 60px; }

.factrow { display: grid; grid-template-columns: 8.4rem 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: .93rem; }
.factrow > .k { font-variant: small-caps; letter-spacing: .08em; color: var(--ink-faint); font-size: .82rem; }

.soilnote { border-left: 3px solid var(--green); background: var(--card-2); padding: 9px 14px; margin: 8px 0; font-size: .92rem; }
.soilnote b { font-variant: small-caps; letter-spacing: .08em; color: var(--green-deep); }

/* --- responsive --------------------------------------------------------- */

@media (max-width: 940px) {
  .mapcol { padding: 12px 12px 14px; }
  .tabbody { padding: 18px 16px 80px; }
  .mapinfo { gap: 10px 18px; }
}

@media print {
  .mapcol, .tabs, header.top { display: none; }
  .game { display: block; }
}

/* --- things the packs cannot draw yet ------------------------------------ */

.pending {
  margin-top: 14px;
  border-top: 1px solid var(--rule);
  padding-top: 10px;
}

.pending > .smallcaps { display: block; margin-bottom: 6px; }

.pendinglist { display: flex; flex-wrap: wrap; gap: 5px; }

.pendinglist .chip { cursor: default; font-size: .72rem; }
.pendinglist .chip:hover { background: var(--paper-2); color: inherit; border-color: var(--rule); }

/* --- the ruler ----------------------------------------------------------- */

.mapgrid {
  display: grid;
  grid-template-columns: 26px 1fr;
  grid-template-rows: 16px 1fr;
  align-items: start;
}

.rcorner {
  font-family: var(--mono);
  font-size: .6rem;
  color: var(--ink-faint);
  text-align: right;
  padding-right: 4px;
  align-self: end;
  line-height: 1;
}

.ruler { position: relative; }

.ruler i {
  position: absolute;
  background: var(--edge);
  display: block;
}

.ruler span {
  position: absolute;
  font-family: var(--mono);
  font-size: .58rem;
  color: var(--ink-faint);
  line-height: 1;
  white-space: nowrap;
}

.ruler.rx { height: 16px; }
.ruler.rx i { bottom: 0; width: 1px; height: 5px; }
.ruler.rx span { bottom: 6px; transform: translateX(-50%); }

.ruler.ry { width: 26px; height: 100%; justify-self: end; }
.ruler.ry i { right: 0; height: 1px; width: 5px; }
.ruler.ry span { right: 7px; transform: translateY(-50%); }

.mapcap {
  margin-top: 7px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  font-size: .74rem;
  color: var(--ink-faint);
  font-family: var(--mono);
}

.mapcap b { font-size: .86rem; color: var(--ink); letter-spacing: .02em; }

.mapcap .tally {
  flex-basis: 100%;
  color: var(--ink-soft);
  border-top: 1px solid var(--rule);
  padding-top: 5px;
  margin-top: 1px;
}

/* --- pointer tooltip ----------------------------------------------------- */

.maptip {
  position: fixed;
  z-index: 80;
  max-width: 34ch;
  background: var(--edge-dark);
  color: #f2e6c8;
  border: 1px solid var(--edge);
  box-shadow: 3px 3px 0 var(--shadow);
  padding: 6px 10px;
  font-size: .8rem;
  line-height: 1.45;
  pointer-events: none;
  opacity: 0;
  transition: opacity .1s;
}

.maptip.on { opacity: 1; }

/* --- auto-build ---------------------------------------------------------- */

.autobar {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.autobtn {
  background: var(--card-2);
  border: 2px solid var(--edge);
  box-shadow: 2px 2px 0 var(--shadow);
  font-variant: small-caps;
  letter-spacing: .08em;
  font-size: .8rem;
  padding: 4px 14px;
}

.autobtn:hover { background: var(--paper-2); }
.autobtn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--shadow); }
.autobtn[disabled] { opacity: .45; cursor: not-allowed; }

.autostatus { font-family: var(--mono); font-size: .74rem; color: var(--ink-faint); }

/* --- collapsible steps --------------------------------------------------- */

.stephead {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  padding: 9px 12px;
}

.stephead .tickbox { cursor: pointer; padding: 0; flex: none; }
.stephead .tickbox:hover { border-color: var(--green); }

.steptitle {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  text-align: left;
  padding: 0;
  font: inherit;
}

.steptitle:hover b { text-decoration: underline; text-underline-offset: 2px; }

.caret {
  font-family: var(--mono);
  color: var(--ink-faint);
  font-size: .9rem;
  flex: none;
  line-height: 1.5;
}

.step.open { border-left-color: var(--gold); }
.step.open .stepbody { padding-top: 12px; }

/* --- the guide drawer sits on off-white, not the warm card tone ---------- */

:root { --sheet: #fbf8f1; --sheet-2: #f2ede1; }

.drawer { background: var(--sheet); }
.drawerhead { background: var(--sheet-2); }
.drawer .callout { background: var(--sheet-2); }
.drawer .soilnote { background: var(--sheet-2); }

/* --- scrollable map board ------------------------------------------------ */

.mapscroll {
  max-height: min(64vh, 660px);
  overflow: auto;
  border: 2px solid var(--edge);
  background: var(--paper-2);
  overscroll-behavior: contain;
  /* shrink-wrap the board and centre it, so a small farm reads as a centred
     plan rather than a small map adrift in a large empty panel */
  width: fit-content;
  max-width: 100%;
  margin: 0 auto;
}

.mapgrid { width: max-content; }

.rcorner {
  position: sticky;
  top: 0;
  left: 0;
  z-index: 4;
  background: var(--paper-2);
}

.ruler.rx { position: sticky; top: 0; z-index: 3; background: var(--paper-2); }
.ruler.ry { position: sticky; left: 0; z-index: 3; background: var(--paper-2); }

.mapframe { border: none; box-shadow: none; position: relative; }

/* --- signboards over each area ------------------------------------------- */

.signlayer { position: absolute; inset: 0; pointer-events: none; }

.sign {
  position: absolute;
  /* seated just inside the top edge of its own block, not floating above it,
     so it never slides under the sticky ruler */
  transform: translate(-50%, 4px);
  pointer-events: auto;
  /* a small nameplate -- the size, crop and counts are one hover away */
  background: var(--edge-dark);
  color: #f2e6c6;
  border: 1px solid #2f2416;
  border-bottom: 2px solid #2f2416;
  padding: 1px 7px 2px;
  font-family: var(--serif);
  font-size: .62rem;
  font-variant: small-caps;
  letter-spacing: .1em;
  font-weight: 700;
  line-height: 1.35;
  white-space: nowrap;
  text-align: center;
  box-shadow: 1px 2px 0 rgba(0, 0, 0, .3);
  opacity: .9;
}

.sign:not([disabled]):hover {
  opacity: 1;
  z-index: 5;
  background: #6b5228;
  border-color: #1f1810;
}

.sign[disabled] { cursor: default; }

@media (max-width: 620px) { .sign { font-size: .56rem; padding: 1px 5px 2px; } }

/* --- reset button, armed state ------------------------------------------- */

.linkbtn.arm {
  background: var(--rust);
  border-color: var(--rust);
  color: #fff4e6;
}

/* --- zone nameplates carved from the wooden signboard sheet -------------- */

.sign.woodsign {
  background: none;
  border-style: solid;
  border-width: 6px 8px 6px 8px;
  padding: 1px 3px 2px;
  box-shadow: none;
  /* dark lettering reads as carved into the plank; cream vanished on the
     lighter boards */
  color: #33210f;
  text-shadow: 0 1px 0 rgba(255, 232, 190, .45);
  image-rendering: pixelated;
  opacity: 1;
}

.sign.woodsign:not([disabled]):hover {
  background: none;
  filter: brightness(1.12);
}

</style>
</head>

// ---------------------------------------------------------------------------
// The plan engine.
//
// buildPlan(acres, stateId) is a pure function: same inputs, same plan, no
// side effects and no DOM. Everything the interface shows is derived from it.
//
// Allocations are interpolated from the scaling table in section 3 of the
// source document, which runs 3 / 5 / 10 / 15 / 25 / 50 / 100 / 250 acres.
// Between those rows we interpolate linearly; outside them we clamp.
// ---------------------------------------------------------------------------

// acres, grain, fodder, veg, fruitTrees, dairy, goats, poultry, pond, biogas m3, solar kWp
const SCALE_TABLE = [
  [3, 1.1, 0.6, 0.30, 25, 1.5, 3, 12, 0.10, 2.0, 2.0],
  [5, 1.8, 1.0, 0.50, 50, 2.5, 5, 22, 0.20, 2.5, 3.0],
  [10, 3.5, 2.0, 1.00, 100, 5, 10, 45, 0.40, 3.5, 4.0],
  [15, 5.0, 3.0, 1.50, 150, 7, 15, 70, 0.60, 5.0, 6.0],
  [25, 9.0, 5.0, 2.00, 250, 12.5, 25, 125, 1.00, 8.0, 10.0],
  [50, 18.0, 10.0, 3.50, 500, 25, 50, 325, 2.00, 17.5, 17.5],
  [100, 37.5, 20.0, 7.00, 1000, 50, 100, 650, 4.00, 25.0, 30.0],
  [250, 95.0, 50.0, 17.50, 2500, 125, 250, 1750, 9.00, 40.0, 70.0]
];

const SCALE_KEYS = [
  'acres', 'grain', 'fodder', 'veg', 'trees',
  'dairy', 'goats', 'poultry', 'pond', 'biogas', 'solar'
];

function interpolate(acres) {
  const t = SCALE_TABLE;
  const out = {};
  let lo = t[0], hi = t[t.length - 1], f = 0;

  if (acres <= t[0][0]) {
    lo = hi = t[0];
  } else if (acres >= t[t.length - 1][0]) {
    lo = hi = t[t.length - 1];
  } else {
    for (let i = 0; i < t.length - 1; i++) {
      if (acres >= t[i][0] && acres <= t[i + 1][0]) {
        lo = t[i]; hi = t[i + 1];
        f = (acres - lo[0]) / (hi[0] - lo[0]);
        break;
      }
    }
  }
  SCALE_KEYS.forEach(function (k, i) { out[k] = lo[i] + (hi[i] - lo[i]) * f; });
  out.acres = acres;
  return out;
}

// ---------------------------------------------------------------------------
// model of the farm at this size -- who works it and what it needs
// ---------------------------------------------------------------------------

function modelFor(acres) {
  if (acres < 5) {
    return {
      label: 'Family self-sufficiency',
      people: 'A nuclear family of 4–6',
      labour: 'Family only. No hired hands, no tractor.',
      kit: 'Hand tools, knapsack sprayer, chaff cutter, and either a power tiller or a pair of bullocks.',
      water: 'One bore well plus rooftop rainwater harvesting, with drip on the vegetable beds.',
      machine: 'tiller'
    };
  }
  if (acres < 10) {
    return {
      label: 'Family plus a modest surplus',
      people: '6–8 people',
      labour: 'Family, with occasional day labour at sowing and harvest.',
      kit: 'As above, plus a farm pond and expanded drip.',
      water: 'Bore well and a farm pond, drip on vegetables and the fruit block.',
      machine: 'tiller'
    };
  }
  if (acres < 15) {
    return {
      label: 'Family plus commercial surplus',
      people: 'Your family plus one or two hired hands — around 8–10 more people counting their households',
      labour: 'One or two part-time labourers. A power tiller becomes essential.',
      kit: 'Power tiller, larger pump, proper grain storage, solar dryer.',
      water: 'Tube well, with drip extended across the fruit and fodder blocks.',
      machine: 'tiller'
    };
  }
  if (acres < 25) {
    return {
      label: 'Small commercial farm',
      people: 'Your family plus 2–4 worker households',
      labour: 'Two to four labourers. This is where you cross from doing the work to managing a payroll.',
      kit: 'Tractor with plough, harrow and seed drill. Mechanised fodder chopping in the cattle shed.',
      water: 'Tube well, drip across all blocks.',
      machine: 'tractor'
    };
  }
  if (acres < 50) {
    return {
      label: 'Commercial farm',
      people: 'Your family plus 4–6 worker households',
      labour: 'Four to six full-time labourers. A tractor is now clearly worth owning.',
      kit: 'Tractor and implements, mechanised shed, cold storage worth considering.',
      water: 'Two tube wells.',
      machine: 'tractor'
    };
  }
  if (acres < 100) {
    return {
      label: 'Medium commercial farm',
      people: 'Your family plus 8–12 worker households',
      labour: 'Eight to twelve labourers. A tractor is essential, not optional.',
      kit: 'Tractor fleet, thresher, cold storage for perishables.',
      water: 'Multiple tube wells; pursue canal access if the district has it.',

    };

  return {

    people: 'Your family as owner-managers, plus 20–50+ worker households',
    labour: 'Full mechanisation and a workforce of twenty upwards. Your family are managers, not labour.',
    kit: 'Full equipment fleet, harvester and thresher owned or seasonally rented, grain cleaning and milling.',
    water: 'Canal irrigation or a reservoir, plus deep tube wells.',
    machine: 'tractor'
  };
}

// ---------------------------------------------------------------------------
// crop selection -- what this state's soil and climate actually support
// ---------------------------------------------------------------------------

function cropById(id) {
  for (let i = 0; i < CROPS.length; i++) if (CROPS[i].id === id) return CROPS[i];
  return null;
}

function pickCrops(state) {
  const known = {};
  CROPS.forEach(function (c) { known[c.id] = c; });

  function resolve(list) {
    return (list || []).map(function (id) { return known[id]; }).filter(Boolean);
  }

  const kharif = resolve(state.kharif);
  const rabi = resolve(state.rabi);
  const fodder = resolve(state.fodder);
  const oil = resolve(state.oil);
  const cash = resolve(state.cash);
  const fruit = resolve(state.fruit);

  const isCereal = function (c) { return c.cat === 'cereal'; };
  const isPulse = function (c) { return c.cat === 'pulse'; };

  // the vegetable plot is the same core set everywhere, filtered to the soil
  const vegIds = ['tomato', 'brinjal', 'okra', 'onion', 'greens', 'gourds', 'rootveg', 'potato', 'cauliflower'];
  const veg = vegIds.map(function (id) { return known[id]; })
    .filter(function (c) {
      return c && c.soils.some(function (s) { return state.soils.indexOf(s) >= 0; });
    });

  return {
    stapleKharif: kharif.filter(isCereal)[0] || kharif[0] || null,
    stapleRabi: rabi.filter(isCereal)[0] || rabi[0] || null,
    pulses: kharif.filter(isPulse).concat(rabi.filter(isPulse)),
    oilseeds: oil,
    fodder: fodder,
    veg: veg,
    fruit: fruit,
    cash: cash,
    kharif: kharif,
    rabi: rabi
  };
}

// ---------------------------------------------------------------------------
// water and energy, from sections 4 and 5
// ---------------------------------------------------------------------------

function waterPlan(sc, state) {
  const rainMid = (state.rain[0] + state.rain[1]) / 2;
  // rooftop harvest: a 100 m2 roof, runoff coefficient 0.8
  const roofHarvest = Math.round(rainMid * 100 * 0.8 / 1000) * 1000;
  // irrigation demand: ~0.4 acre-metre per acre per season on cropped area
  const cropped = sc.grain + sc.fodder + sc.veg;
  const seasonDemand = Math.round(cropped * 0.4 * 4046.86); // cubic metres
  return {
    rainMid: Math.round(rainMid),
    roofHarvest: roofHarvest,
    domestic: 200,
    croppedAcres: cropped,
    seasonDemand: seasonDemand,
    seasonDemandDrip: Math.round(seasonDemand * 0.6)
  };
}

function energyPlan(sc) {
  const kwp = sc.solar;
  let profile, load, battery;
  if (kwp <= 3) {
    profile = 'Basic — LED lighting, fans, phone charging, a small television and a small pump';
    load = '2.5–3 kWh a day';
    battery = '3–4 kWh usable';
  } else if (kwp <= 8) {
    profile = 'Comfortable — adds a refrigerator, more pumping hours and a grinder';
    load = '5–7 kWh a day';
    battery = '8–10 kWh usable';
  } else {
    profile = 'Commercial — irrigation pumps, cold storage and processing equipment';
    load = '20 kWh a day and upwards';
    battery = 'Grid-tied hybrid, or a large battery bank sized to your worst month';
  }
  return {
    kwp: Math.round(kwp * 10) / 10,
    profile: profile, load: load, battery: battery,
    biogas: Math.round(sc.biogas * 10) / 10,
    biogasNote: sc.biogas <= 6
      ? 'A Deenbandhu fixed-dome plant. No moving parts, 15–20 year life, and 30–45% cheaper to build than the floating-dome KVIC design.'
      : 'At this scale a biogas-to-power unit is worth pricing against multiple household plants. It is a genuinely different system, not simply a larger one.'
  };
}

// ---------------------------------------------------------------------------
// budget, in rupees
// ---------------------------------------------------------------------------

function budgetFor(sc, state, model) {
  const rows = [];
  const acres = sc.acres;

  const landLow = state.price[0] * acres;
  const landHigh = state.price[1] * acres;
  rows.push({
    item: 'Land', detail: state.priceNote,
    low: landLow, high: landHigh, land: true
  });

  rows.push({
    item: 'Biogas plant',
    detail: sc.biogas.toFixed(1) + ' m³ — roughly ₹17,000 for a household 2 m³ unit before subsidy',
    low: Math.round(8500 * sc.biogas), high: Math.round(14000 * sc.biogas)
  });
  rows.push({
    item: 'Off-grid solar',
    detail: sc.solar.toFixed(1) + ' kWp with battery',
    low: Math.round(75000 * sc.solar), high: Math.round(130000 * sc.solar)
  });
  rows.push({
    item: 'Dairy animals',
    detail: Math.round(sc.dairy) + ' desi cow or buffalo',
    low: 30000 * Math.round(sc.dairy), high: 80000 * Math.round(sc.dairy)
  });
  rows.push({
    item: 'Goats',
    detail: Math.round(sc.goats) + ' head',
    low: 5000 * Math.round(sc.goats), high: 10000 * Math.round(sc.goats)
  });
  rows.push({
    item: 'Poultry',
    detail: Math.round(sc.poultry) + ' backyard birds',
    low: 150 * Math.round(sc.poultry), high: 300 * Math.round(sc.poultry)
  });
  rows.push({
    item: 'Drip irrigation',
    detail: (Math.round((sc.veg + sc.fodder) * 10) / 10) +
      ' acre to start — 50–90% subsidy for small and marginal farmers under PMKSY',
    low: Math.round(20000 * (sc.veg + sc.fodder)),
    high: Math.round(40000 * (sc.veg + sc.fodder))
  });
  rows.push({
    item: 'Farm pond',
    detail: (Math.round(sc.pond * 100) / 100) + ' acre of water, often subsidised by the state fisheries department',
    low: Math.round(150000 * sc.pond), high: Math.round(300000 * sc.pond)
  });
  rows.push({
    item: 'Cattle shed and coop',
    detail: 'Housing for ' + Math.round(sc.dairy) + ' cattle, ' +
      Math.round(sc.goats) + ' goats and ' + Math.round(sc.poultry) + ' birds',
    low: Math.round(25000 * sc.dairy + 8000), high: Math.round(45000 * sc.dairy + 15000)
  });
  rows.push({
    item: model.machine === 'tractor' ? 'Tractor and implements' : 'Power tiller',
    detail: model.machine === 'tractor'
      ? 'Worth owning above roughly 15 acres'
      : 'Or a pair of bullocks at ₹40,000–80,000, competitive below about 10 acres',
    low: model.machine === 'tractor' ? 600000 : 130000,
    high: model.machine === 'tractor' ? 900000 : 200000
  });
  rows.push({
    item: 'Fencing',
    detail: 'Perimeter — stray cattle and nilgai are a real threat across most of rural India',
    low: Math.round(30000 * Math.sqrt(acres / 3)),
    high: Math.round(60000 * Math.sqrt(acres / 3))
  });
  rows.push({
    item: 'Water: bore well, tank and rainwater harvesting',
    detail: model.water,
    low: acres < 10 ? 120000 : 250000, high: acres < 10 ? 250000 : 600000
  });

  const setupLow = rows.filter(function (r) { return !r.land; })
    .reduce(function (a, r) { return a + r.low; }, 0);
  const setupHigh = rows.filter(function (r) { return !r.land; })
    .reduce(function (a, r) { return a + r.high; }, 0);

  return { rows: rows, setupLow: setupLow, setupHigh: setupHigh, landLow: landLow, landHigh: landHigh };
}

// ---------------------------------------------------------------------------
// land allocation, rounded for display
// ---------------------------------------------------------------------------

function allocationFor(sc) {
  const acres = sc.acres;
  const grain = sc.grain;
  const fodder = sc.fodder;
  const veg = sc.veg;
  const pond = sc.pond;
  const pulseOil = acres * 0.12;
  const fruit = acres * 0.10;
  const home = acres * 0.08;
  const used = grain + fodder + veg + pond + pulseOil + fruit + home;
  const spare = Math.max(0, acres - used);

  const rows = [
    { key: 'grain', name: 'Cereal — the staple grain', acres: grain, tint: '#d8a53a' },
    { key: 'fodder', name: 'Fodder for the animals', acres: fodder, tint: '#5f9e3f' },
    { key: 'pulseOil', name: 'Pulses and oilseeds', acres: pulseOil, tint: '#a3563c' },
    { key: 'veg', name: 'Vegetables, rotated', acres: veg, tint: '#7fb43a' },
    { key: 'fruit', name: 'Fruit and agroforestry', acres: fruit, tint: '#3f7f4a' },
    { key: 'pond', name: 'Farm pond', acres: pond, tint: '#3678a9' },
    { key: 'home', name: 'House, sheds, biogas, paths', acres: home, tint: '#9a7b52' }
  ];
  if (spare > 0.05) {
    rows.push({ key: 'spare', name: 'Buffer, windbreak and wild edge', acres: spare, tint: '#5b6b4a' });
  }
  return rows;
}

// ---------------------------------------------------------------------------
// the whole plan
// ---------------------------------------------------------------------------

function buildPlan(acres, stateId) {
  const state = STATES.filter(function (s) { return s.id === stateId; })[0];
  if (!state) throw new Error('unknown state: ' + stateId);

  acres = Math.max(3, Math.min(250, acres));

  const sc = interpolate(acres);
  const model = modelFor(acres);
  const crops = pickCrops(state);
  const soils = state.soils.map(function (id) {
    return Object.assign({ id: id }, SOILS[id]);
  });

  const plan = {
    acres: acres,
    state: state,
    soils: soils,
    primarySoil: soils[0],
    scale: sc,
    model: model,
    crops: crops,
    alloc: allocationFor(sc),
    livestock: {
      dairy: Math.max(1, Math.round(sc.dairy)),
      goats: Math.round(sc.goats),
      poultry: Math.round(sc.poultry),
      trees: Math.round(sc.trees),
      pond: sc.pond
    },
    water: waterPlan(sc, state),
    energy: energyPlan(sc)
  };

  plan.budget = budgetFor(sc, state, model);
  plan.steps = buildSteps(plan);
  return plan;
}

// ---------------------------------------------------------------------------
// formatting helpers shared across the interface
// ---------------------------------------------------------------------------

function rupees(n) {
  if (n >= 10000000) return '₹' + (n / 10000000).toFixed(n < 100000000 ? 2 : 1) + ' cr';
  if (n >= 100000) return '₹' + (n / 100000).toFixed(n < 1000000 ? 1 : 0) + ' lakh';
  if (n >= 1000) return '₹' + Math.round(n / 1000) + ',000';
  return '₹' + Math.round(n);
}

function acresText(a) {
  if (a >= 10) return a.toFixed(0) + ' acres';
  if (a >= 1) return a.toFixed(1) + ' acres';
  if (a >= 0.1) return a.toFixed(2).replace(/0$/, '') + ' acre';
  // below a tenth of an acre, square feet is the number people can picture
  return Math.round(a * 43560).toLocaleString('en-IN') + ' sq ft';
}

/* ===== farm.js =================================================== */
// ---------------------------------------------------------------------------
// The farm map.
//
// A tile grid laid out in the five zones of section 9, sized to the acreage.
// Nothing here knows about the DOM beyond the one canvas it draws into: give
// it a plan and a set of completed step ids and it renders that farm.
//
// Sprites are drawn anchored bottom-centre on their tile, so a tall sprite
// (a house, a mature crop) overhangs upward the way it should. The grid keeps
// PAD_TOP rows of headroom above the fence for exactly that reason, and a
// two-tile planting ring inside the fence so boundary trees never overhang the
// cropped blocks.
// ---------------------------------------------------------------------------

const TILE = 16;
const PAD_TOP = 3;          // headroom rows above the fence, for tall sprites
// Boundary planting ring inside the fence. Three tiles, not two: the orchard
// trees are up to 53px wide, and at two they reached into the cropped blocks.
const RING = 3;
const GROW_MS = 260;        // per crop growth stage

function cropSprite(crop) {
  return crop && crop.sprite ? crop.sprite : 'berry';
}

// Stable hash per tile, 0..1. A plain modulo pattern reads as a checkerboard
// at any zoom, which is exactly what grass must not do.
function tileHash(x, y) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

// ---------------------------------------------------------------------------
// layout
// ---------------------------------------------------------------------------

function layoutFarm(plan) {
  // Deliberately NOT to scale -- 6 acres is not twice the size of 3 on screen.
  // The grid grows just enough that animals, buildings and crop rows never look
  // jammed, and the ruler carries the real dimensions instead.
  //
  // Width grows far faster than height on purpose: a large farm becomes a wide
  // board you pan across sideways, rather than a tall one that pushes the
  // meters and the build order off the bottom of the screen.
  const t = Math.log(plan.acres / 3) / Math.log(250 / 3);      // 0 .. 1
  const w = Math.round(34 + 46 * t);
  const farmH = Math.round(26 + 10 * t);
  const h = farmH + PAD_TOP;

  const fence = { x: 0, y: PAD_TOP, w: w, h: farmH };

  const ix = fence.x + RING + 1;
  const iy = fence.y + RING + 1;
  const iw = fence.w - 2 * (RING + 1);
  const ih = fence.h - 2 * (RING + 1);

  const leftW = Math.floor(iw * 0.42);
  const rightX = ix + leftW + 2;
  const rightW = iw - leftW - 2;

  // left column: homestead, then animals, then pond
  const homeH = Math.floor(ih * 0.42);
  const animH = Math.floor(ih * 0.30);
  const pondH = ih - homeH - animH - 2;

  // right column: field blocks in proportion to the land allocation
  const shares = {
    cereal: plan.scale.grain,
    fodder: plan.scale.fodder,
    pulses: plan.acres * 0.12
  };
  const total = shares.cereal + shares.fodder + shares.pulses;
  const usable = ih - 2;
  let cerealH = Math.max(3, Math.round(usable * shares.cereal / total));
  let fodderH = Math.max(3, Math.round(usable * shares.fodder / total));
  let pulsesH = Math.max(3, usable - cerealH - fodderH);
  const over = (cerealH + fodderH + pulsesH) - usable;
  if (over > 0) cerealH = Math.max(3, cerealH - over);

  return {
    w: w, h: h, fence: fence,
    blocks: {
      home: { x: ix, y: iy, w: leftW, h: homeH },
      animals: { x: ix, y: iy + homeH + 1, w: leftW, h: animH },
      pond: { x: ix, y: iy + homeH + animH + 2, w: leftW, h: pondH },
      cereal: { x: rightX, y: iy, w: rightW, h: cerealH },
      fodder: { x: rightX, y: iy + cerealH + 1, w: rightW, h: fodderH },
      pulses: { x: rightX, y: iy + cerealH + fodderH + 2, w: rightW, h: pulsesH }
    }
  };
}

// The real-world size of the plot, so the ruler can be honest. The map keeps
// the grid's aspect ratio, so both axes come out at the same metres per tile.
function farmMetrics(plan, L) {
  const areaM2 = plan.acres * 4046.856;
  const aspect = L.fence.w / L.fence.h;
  const heightM = Math.sqrt(areaM2 / aspect);
  const widthM = aspect * heightM;
  return {
    areaM2: areaM2,
    widthM: widthM,
    heightM: heightM,
    mPerTile: widthM / L.fence.w
  };
}

// the round number closest to eight divisions along the edge
function rulerStep(lengthM) {
  const nice = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000];
  const want = lengthM / 8;
  let best = nice[0];
  for (let i = 1; i < nice.length; i++) {
    if (Math.abs(nice[i] - want) < Math.abs(best - want)) best = nice[i];
  }
  return best;
}

// ---------------------------------------------------------------------------
// what is standing on the farm, given which steps are done
// ---------------------------------------------------------------------------

// the kitchen garden occupies the bottom strip of the homestead block
function gardenRect(L) {
  const B = L.blocks;
  return {
    x: B.home.x,
    y: B.home.y + B.home.h - 2,
    w: Math.max(4, B.home.w - 3),
    h: 2
  };
}

// spread n items evenly across a rect, so a herd never bunches into a corner
function spread(rect, n, cb) {
  if (n <= 0) return;
  const cols = Math.max(1, Math.min(n, Math.floor(rect.w / 2)));
  const rows = Math.max(1, Math.ceil(n / cols));
  for (let i = 0; i < n; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    const x = rect.x + Math.round((c + 0.5) * rect.w / cols) - 1;
    const y = rect.y + Math.round((r + 0.5) * rect.h / rows) - 1;
    cb(Math.max(rect.x, Math.min(rect.x + rect.w - 1, x)),
       Math.max(rect.y, Math.min(rect.y + rect.h - 1, y)), i);
  }
}

// At most this many of any one species on screen -- a 250-acre farm has 1,750
// birds and drawing them would be nonsense. The signboard carries the real count.
const MAX_ON_SCREEN = 10;

// which orchard sprite suits the fruit this state actually grows
function orchardSprite(plan, i) {
  const ids = (plan.crops.fruit || []).map(function (c) { return c.id; });
  const options = [];
  if (ids.indexOf('coconut') >= 0) options.push('palm');
  if (ids.indexOf('banana') >= 0) options.push('banana_tree');
  if (ids.indexOf('apple') >= 0) options.push('fruit_apple');
  if (ids.indexOf('lemon') >= 0) options.push('fruit_lemon');
  if (ids.indexOf('mango') >= 0) options.push('fruit_plum');
  if (ids.indexOf('guava') >= 0) options.push('leafy_tree');
  if (!options.length) options.push('fruit_apple', 'leafy_tree');
  return options[i % options.length];
}

function featuresFor(plan, L, done) {
  const B = L.blocks;
  const f = [];
  const has = function (id) { return done.indexOf(id) >= 0; };

  const put = function (x, y, sprite, kind, tip, action) {
    f.push({ x: x, y: y, sprite: sprite, kind: kind || 'prop', tip: tip, action: action });
  };
  // No pack carries the off-grid infrastructure, goats, bees or fish. Rather
  // than invent them, the step plants a surveyor's marker where the thing goes
  // and the interface lists what is outstanding.
  const mark = function (x, y, label, stepId, note) {
    f.push({
      x: x, y: y, sprite: 'signpost', kind: 'marker', awaiting: label,
      tip: label + (note ? ' — ' + note : '') + ' · no sprite in the packs yet',
      action: stepId ? { type: 'step', id: stepId } : null
    });
  };

  const ls = plan.livestock;
  const e = plan.energy;

  // --- homestead ---------------------------------------------------------
  const hx = B.home.x, hy = B.home.y, hw = B.home.w, hh = B.home.h;
  const bottom = hy + hh - 1;

  if (has('house-build')) {
    // anchored high enough that the tall sprite overhangs the fence rather
    // than clipping off the top of the canvas
    put(hx + 3, hy + 4, 'farmhouse', 'building',
      'Farmhouse — sited high, long axis east-west, deep veranda south and west',
      { type: 'step', id: 'house-build' });
    put(hx + 6, hy + 4, 'lantern', 'prop', 'Yard light', null);
  }

  if (has('soil-test')) {
    put(hx + hw - 1, hy, 'signpost', 'prop',
      'Soil test marker — ' + plan.primarySoil.name + ', pH ' + plan.primarySoil.ph,
      { type: 'step', id: 'soil-test' });
  }
  if (has('storage')) {
    put(hx, hy, 'chest', 'prop', 'Grain store — dried to 12% before binning',
      { type: 'step', id: 'storage' });
    put(hx + 2, hy, 'crate_grain', 'prop',
      'Grain crates — post-harvest loss runs 8–10% and almost all of it is avoidable',
      { type: 'step', id: 'storage' });
  }
  if (has('water-source')) {
    put(hx + hw - 3, hy + 1, 'well', 'building',
      'Well — household draw ' + plan.water.domestic + ' litres a day; check the ' +
      'block groundwater category before drilling',
      { type: 'step', id: 'water-source' });
    put(hx + hw - 5, hy + 2, 'barrel_big', 'prop',
      'Water butt — rooftop harvest, about ' +
      plan.water.roofHarvest.toLocaleString('en-IN') + ' litres a year off a 100 m² roof',
      { type: 'step', id: 'rainwater' });
  }
  if (has('machinery')) {
    const big = plan.acres >= 15;
    put(hx + 5, hy + 3, big ? 'tractor' : 'cart', 'building',
      (big ? 'Tractor — worth owning above about 15 acres'
           : 'Power tiller and cart — or a pair of bullocks at ₹40,000–80,000'),
      { type: 'step', id: 'machinery' });
  }
  if (has('solar-lighting') || has('solar-scale')) {
    mark(hx + 1, bottom - 2, 'Solar panel array', 'solar-scale',
      e.kwp + ' kWp, ' + e.battery + ' battery');
  }
  if (has('biogas')) {
    mark(hx + hw - 3, bottom - 2, 'Biogas plant (fixed dome)', 'biogas',
      e.biogas + ' m³, fed on ' + Math.round(ls.dairy * 12) + ' kg of dung a day');
  }
  if (has('compost')) {
    put(hx + hw - 2, bottom - 1, 'crate_green', 'prop',
      'Compost bay — crop residue, weeds and kitchen waste, turned every 3 weeks',
      { type: 'step', id: 'compost' });
    put(hx + hw - 1, bottom, 'crate_dark', 'prop',
      'Vermicompost bed — Eisenia fetida worms in pre-decomposed material',
      { type: 'step', id: 'compost' });
  }

  // --- animals -----------------------------------------------------------
  const ax = B.animals.x, ay = B.animals.y, aw = B.animals.w, ah = B.animals.h;

  // the yard is split into three lanes so the species do not tangle
  const laneH = Math.max(1, Math.floor(ah / 3));
  const poultryLane = { x: ax + 3, y: ay, w: aw - 4, h: laneH };
  const cattleLane = { x: ax + 3, y: ay + laneH, w: aw - 4, h: laneH };
  const goatLane = { x: ax + 3, y: ay + 2 * laneH, w: aw - 4, h: ah - 2 * laneH };

  if (has('poultry')) {
    mark(ax + 1, ay + 1, 'Poultry coop', 'poultry', '3 sq ft a bird, raised, shut at night');
    const shown = Math.min(MAX_ON_SCREEN, ls.poultry);
    const tip = 'Backyard poultry — ' + ls.poultry + ' birds, 100–150 eggs each a year' +
      (ls.poultry > shown ? ' (' + shown + ' of ' + ls.poultry + ' drawn)' : '');
    spread(poultryLane, shown, function (x, y, i) {
      put(x, y, i % 5 === 4 ? 'chick_0' : (i % 2 ? 'hen_0' : 'hen2_0'), 'animal',
        tip, { type: 'animal', id: 'poultry' });
    });
  }
  if (has('cattle-shed')) {
    // anchored on the block's bottom row: the sprite is five tiles tall and
    // reaches up into the kitchen garden from anywhere higher
    put(ax + 1, ay + ah - 1, 'barn', 'building',
      'Cattle shed — 12 sq m an animal, floor sloped to a covered drain',
      { type: 'step', id: 'cattle-shed' });
  }
  if (has('dairy') || has('dairy-2')) {
    const herd = has('dairy-2') ? ls.dairy : 1;
    const shown = Math.min(MAX_ON_SCREEN, herd);
    const tip = 'Dairy cattle — ' + ls.dairy + ' head, ' + acresText(plan.scale.fodder) +
      ' of fodder feeds them' + (herd > shown ? ' (' + shown + ' of ' + herd + ' drawn)' : '');
    spread(cattleLane, shown, function (x, y, i) {
      put(x, y, i % 4 === 3 ? 'bull_0' : 'cow_0', 'animal', tip,
        { type: 'animal', id: 'cattle' });
    });
  }
  if (has('goats')) {
    mark(ax + 1, ay + ah - 1, 'Goat pen', 'goats', 'raised slatted floor, 1 sq m an adult');
    const shown = Math.min(MAX_ON_SCREEN, ls.goats);
    const tip = 'Goats — ' + ls.goats + ' head, browsers not grazers. Shown as a sheep: ' +
      'no pack here has a goat sprite' +
      (ls.goats > shown ? ' (' + shown + ' of ' + ls.goats + ' drawn)' : '');
    spread(goatLane, shown, function (x, y) {
      put(x, y, 'sheep_0', 'animal', tip, { type: 'animal', id: 'goat' });
    });
  }
  if (has('bees')) {
    const tip = 'Beehives — 2–4 colonies of Apis cerana indica; pollination lifts ' +
      'yield 20–40% across the whole farm';
    put(ax + aw - 2, ay, 'hive', 'building', tip, { type: 'animal', id: 'bees' });
    put(ax + aw - 4, ay, 'hive', 'building', tip, { type: 'animal', id: 'bees' });
    put(ax + aw - 3, ay - 1, 'bee', 'prop', tip, { type: 'animal', id: 'bees' });
  }
  if (has('labour')) {
    put(ax + aw - 3, ay + ah - 1, 'cottage', 'building',
      'Worker quarters — ' + plan.model.people.toLowerCase(),
      { type: 'step', id: 'labour' });
  }

  // --- pond --------------------------------------------------------------
  const p = B.pond;
  if (has('pond')) {
    for (let x = p.x + 1; x < p.x + p.w - 1; x += 3) {
      put(x, p.y, 'reeds', 'prop', 'Pond bank', { type: 'step', id: 'pond' });
      put(x + 1, p.y + p.h - 1, 'reeds', 'prop', 'Pond bank', { type: 'step', id: 'pond' });
    }
    const by = p.y + Math.floor(p.h / 2);
    put(p.x + 1, by, 'bridge_l', 'prop', 'Plank crossing', { type: 'step', id: 'pond' });
    put(p.x + 2, by, 'bridge_m', 'prop', 'Plank crossing', { type: 'step', id: 'pond' });
    put(p.x + 3, by, 'bridge_r', 'prop', 'Plank crossing', { type: 'step', id: 'pond' });
  }
  if (has('fish')) {
    mark(p.x + p.w - 2, p.y + 1, 'Fish', 'fish',
      'catla, rohu and mrigal at 4:3:3, ~4,000 fingerlings an acre');
  }

  return f;
}

// A plaque for each major area, positioned in tile coordinates at the top edge
// of its block. The interface renders these as DOM labels over the canvas so
// the wording stays crisp at any zoom.
function zoneSigns(plan, L, done) {
  const B = L.blocks, c = plan.crops, ls = plan.livestock;
  const has = function (id) { return done.indexOf(id) >= 0; };
  const nm = function (x) { return x ? x.name : null; };
  const out = [];
  // The board shows the section name and nothing else. Its size, crop and
  // counts are one hover away, and the tally line under the map carries the
  // livestock totals.
  const sign = function (rect, label, tip, action) {
    out.push({
      x: rect.x + rect.w / 2, y: rect.y, label: label, tip: tip, action: action
    });
  };

  if (has('zones')) {
    sign(B.home, 'Homestead', acresText(plan.acres * 0.08) + ' with sheds and paths',
      { type: 'step', id: 'zones' });
    sign(B.animals, 'Animal yard',
      ls.dairy + ' cattle · ' + ls.goats + ' goats · ' + ls.poultry + ' birds',
      { type: 'animal', id: 'cattle' });
  }
  if (has('kharif') || has('rabi')) {
    const crop = has('rabi') && c.stapleRabi ? c.stapleRabi : c.stapleKharif;
    sign(B.cereal, nm(crop) || 'Cereal', acresText(plan.scale.grain) + ' of staple grain',
      crop ? { type: 'crop', id: crop.id } : null);
  }
  if (has('fodder-plot')) {
    sign(B.fodder, 'Fodder', acresText(plan.scale.fodder) + ' of ' +
      (nm(c.fodder[0]) || 'napier') + ', about 0.25 acre an animal',
      c.fodder[0] ? { type: 'crop', id: c.fodder[0].id } : null);
  }
  if (has('pulses')) {
    sign(B.pulses, 'Pulses & oilseeds', acresText(plan.acres * 0.12) + ' of ' +
      [nm(c.pulses[0]), nm(c.oilseeds[0])].filter(Boolean).join(' and '),
      c.pulses[0] ? { type: 'crop', id: c.pulses[0].id } : null);
  }
  if (has('pond')) {
    sign(B.pond, 'Farm pond', acresText(ls.pond) +
      (has('fish') ? ' · carp polyculture' : ' · irrigation buffer'),
      { type: 'step', id: 'pond' });
  }
  if (has('kitchen-garden')) {
    const g = gardenRect(L);
    sign(g, 'Kitchen garden', acresText(plan.scale.veg) + ' of raised beds, sown in succession',
      c.veg[0] ? { type: 'crop', id: c.veg[0].id } : null);
  }
  if (has('boundary-trees')) {
    sign({ x: L.fence.x + 2, y: L.fence.y + 1, w: 6, h: 1 }, 'Orchard',
      ls.trees + ' trees on ' + acresText(plan.acres * 0.10) +
      ', planted on the edge so they cost no cropping land',
      c.fruit[0] ? { type: 'crop', id: c.fruit[0].id } : null);
  }
  return out;
}

// distinct labels for everything the packs cannot draw yet
function awaitingArt(features) {
  const seen = [];
  features.forEach(function (o) {
    if (o.awaiting && seen.indexOf(o.awaiting) < 0) seen.push(o.awaiting);
  });
  return seen;
}

// ---------------------------------------------------------------------------
// crop plantings
// ---------------------------------------------------------------------------

function plantingsFor(plan, L, done) {
  const B = L.blocks;
  const out = [];
  const has = function (id) { return done.indexOf(id) >= 0; };
  const c = plan.crops;

  function sow(block, crops, acres, label) {
    // a field block can only carry crops that have growth frames -- tree crops
    // belong on the boundary, never sown in rows
    crops = (crops || []).filter(function (x) {
      return x && ATLAS['crop_' + cropSprite(x) + '_3'];
    });
    if (!crops.length) return;
    for (let y = block.y; y < block.y + block.h; y++) {
      for (let x = block.x; x < block.x + block.w; x++) {
        const crop = crops[(x * 3 + y * 5) % crops.length];
        out.push({
          x: x, y: y, sprite: cropSprite(crop), seed: (x * 31 + y * 17) % 97,
          crop: crop, acres: acres, label: label
        });
      }
    }
  }

  if (has('kharif') || has('rabi')) {
    const crop = has('rabi') && c.stapleRabi ? c.stapleRabi : c.stapleKharif;
    sow(B.cereal, [crop], plan.scale.grain, 'Cereal block');
  }
  if (has('fodder-plot')) {
    sow(B.fodder, c.fodder.length ? c.fodder : [{ sprite: 'tallgrass' }],
      plan.scale.fodder, 'Fodder plot');
  }
  if (has('pulses')) {
    sow(B.pulses, c.pulses.concat(c.oilseeds), plan.acres * 0.12, 'Pulses & oilseeds');
  }
  if (has('kitchen-garden')) {
    sow(gardenRect(L), c.veg.length ? c.veg : [{ sprite: 'lettuce' }],
      plan.scale.veg, 'Kitchen garden');
  }
  return out;
}

// tiles that should be drawn as tilled soil rather than grass
function fieldRects(plan, L, done) {
  const B = L.blocks;
  const has = function (id) { return done.indexOf(id) >= 0; };
  const r = [];
  if (has('kharif') || has('rabi')) r.push({ rect: B.cereal, wet: has('drip') });
  if (has('pulses')) r.push({ rect: B.pulses, wet: has('drip') });
  if (has('kitchen-garden')) r.push({ rect: gardenRect(L), wet: has('drip') });
  return r;
}

// ---------------------------------------------------------------------------
// renderer
// ---------------------------------------------------------------------------

function FarmView(canvas, atlasImage) {
  this.canvas = canvas;
  this.ctx = canvas.getContext('2d');
  this.img = atlasImage;
  this.plan = null;
  this.done = [];
  this.scale = 2;
  this.t = 0;
  this.plantedAt = {};
  this.targets = [];
  this.farmer = { x: 6, y: 6, tx: 6, ty: 6, face: 'd', act: 'idle', frame: 0, wait: 0 };
  this.ctx.imageSmoothingEnabled = false;
}

FarmView.prototype.draw = function (name, px, py) {
  const r = ATLAS[name];
  if (!r) return;
  this.ctx.drawImage(this.img, r[0], r[1], r[2], r[3],
    Math.round(px), Math.round(py), r[2], r[3]);
};

// bottom-centre anchored on a tile
FarmView.prototype.spriteBox = function (name, tx, ty) {
  const r = ATLAS[name];
  if (!r) return null;
  return {
    x: tx * TILE + TILE / 2 - r[2] / 2,
    y: (ty + 1) * TILE - r[3],
    w: r[2], h: r[3]
  };
};

FarmView.prototype.drawOn = function (name, tx, ty) {
  const b = this.spriteBox(name, tx, ty);
  if (b) this.draw(name, b.x, b.y);
};

// same, but flipped horizontally, so a wandering animal faces where it walks
FarmView.prototype.drawOnFlipped = function (name, tx, ty) {
  const r = ATLAS[name];
  const b = this.spriteBox(name, tx, ty);
  if (!r || !b) return;
  const ctx = this.ctx;
  ctx.save();
  ctx.translate(Math.round(b.x + b.w), Math.round(b.y));
  ctx.scale(-1, 1);
  ctx.drawImage(this.img, r[0], r[1], r[2], r[3], 0, 0, r[2], r[3]);
  ctx.restore();
};

FarmView.prototype.setPlan = function (plan, done) {
  const fresh = !this.plan || this.plan.acres !== plan.acres ||
    this.plan.state.id !== plan.state.id;
  this.plan = plan;
  this.done = done || [];
  this.layout = layoutFarm(plan);
  this.metrics = farmMetrics(plan, this.layout);
  // one fence style for the whole farm, re-rolled only when a new farm starts
  this.fence = (typeof FENCE_STYLES === 'number' && FENCE_STYLES > 0)
    ? 'fence' + ((plan.seed || 1) % FENCE_STYLES) + '_'
    : null;
  if (fresh) {
    this.plantedAt = {};
    this.farmer.x = this.farmer.tx = this.layout.blocks.home.x + 4;
    this.farmer.y = this.farmer.ty = this.layout.blocks.home.y + 6;
  }
  this.features = featuresFor(plan, this.layout, this.done);
  this.plantings = plantingsFor(plan, this.layout, this.done);
  this.fields = fieldRects(plan, this.layout, this.done);
  this.signs = zoneSigns(plan, this.layout, this.done);

  const now = performance.now();
  const self = this;
  this.plantings.forEach(function (p) {
    const k = p.x + ',' + p.y + ',' + p.sprite;
    if (!(k in self.plantedAt)) self.plantedAt[k] = now + p.seed * 4;
  });

  // every animal drifts around the spot it was placed on, penned to its yard
  const yard = this.layout.blocks.animals;
  this.features.forEach(function (o) {
    if (o.kind !== 'animal') return;
    o.hx = o.x; o.hy = o.y;          // home tile
    o.ox = 0; o.oy = 0;              // current offset, in tiles
    o.tox = 0; o.toy = 0;            // where it is heading
    o.wait = 400 + Math.random() * 3200;
    o.face = 1;
    o.pen = {
      x0: yard.x + 0.5, x1: yard.x + yard.w - 1.5,
      y0: yard.y, y1: yard.y + yard.h - 1
    };
  });

  this.buildTargets();
  this.resize();
};

// Animals wander a couple of tiles around their home spot: two or three
// sideways, one or two up and down, with a pause between moves. Kept inside
// the yard, and inside the fence, whatever the block size.
FarmView.prototype.stepAnimals = function (dt) {
  const self = this;
  this.features.forEach(function (o) {
    if (o.kind !== 'animal' || o.hx === undefined) return;
    const dx = o.tox - o.ox, dy = o.toy - o.oy;
    const dist = Math.hypot(dx, dy);

    if (dist < 0.04) {
      o.ox = o.tox; o.oy = o.toy;
      o.wait -= dt;
      if (o.wait <= 0) {
        o.tox = (Math.random() * 5 - 2.5);      // +/- 2.5 tiles sideways
        o.toy = (Math.random() * 3 - 1.5);      // +/- 1.5 tiles up and down
        o.wait = 900 + Math.random() * 4000;
      }
    } else {
      const speed = 0.55 * dt / 1000;
      o.ox += dx / dist * Math.min(speed, dist);
      o.oy += dy / dist * Math.min(speed, dist);
      if (Math.abs(dx) > 0.05) o.face = dx > 0 ? 1 : -1;
    }
    const p = o.pen;
    o.x = Math.max(p.x0, Math.min(p.x1, o.hx + o.ox));
    o.y = Math.max(p.y0, Math.min(p.y1, o.hy + o.oy));
    if (o.target) {                              // keep hover in step
      const b = self.spriteBox(o.sprite, o.x, o.y);
      if (b) { o.target.x = b.x; o.target.y = b.y; }
    }
  });
};

// ---------------------------------------------------------------------------
// hit testing -- what the pointer is over
// ---------------------------------------------------------------------------

FarmView.prototype.buildTargets = function () {
  const L = this.layout, B = L.blocks, plan = this.plan;
  const done = this.done;
  const has = function (id) { return done.indexOf(id) >= 0; };
  const t = [];
  const rect = function (r, tip, action) {
    t.push({
      x: r.x * TILE, y: r.y * TILE, w: r.w * TILE, h: r.h * TILE,
      tip: tip, action: action
    });
  };

  // zone-sized targets go in first, so anything standing on them wins
  const c = plan.crops;
  const nm = function (x) { return x ? x.name : '—'; };

  rect(B.home, 'Homestead — house, kitchen garden, energy and compost · ' +
    acresText(plan.acres * 0.08) + ' with sheds and paths',
    { type: 'step', id: 'zones' });
  rect(B.animals, 'Animal yard — ' + plan.livestock.dairy + ' cattle, ' +
    plan.livestock.goats + ' goats, ' + plan.livestock.poultry + ' birds',
    { type: 'animal', id: 'cattle' });

  if (has('pond')) {
    rect(B.pond, 'Farm pond — ' + acresText(plan.livestock.pond) +
      ' · irrigation buffer, groundwater recharge and fish',
      { type: 'step', id: 'pond' });
  }
  if (has('kharif') || has('rabi')) {
    const crop = has('rabi') && c.stapleRabi ? c.stapleRabi : c.stapleKharif;
    rect(B.cereal, 'Cereal block — ' + nm(crop) + ' · ' + acresText(plan.scale.grain) +
      ' on ' + plan.primarySoil.name.toLowerCase(),
      crop ? { type: 'crop', id: crop.id } : null);
  }
  if (has('fodder-plot')) {
    rect(B.fodder, 'Fodder plot — ' + nm(c.fodder[0]) + ' · ' +
      acresText(plan.scale.fodder) + ' · about 0.25 acre an animal',
      c.fodder[0] ? { type: 'crop', id: c.fodder[0].id } : null);
  }
  if (has('pulses')) {
    rect(B.pulses, 'Pulses & oilseeds — ' + nm(c.pulses[0]) + ', ' + nm(c.oilseeds[0]) +
      ' · ' + acresText(plan.acres * 0.12),
      c.pulses[0] ? { type: 'crop', id: c.pulses[0].id } : null);
  }
  if (has('kitchen-garden')) {
    rect(gardenRect(L), 'Kitchen garden — ' + acresText(plan.scale.veg) +
      ' of raised beds, sown in succession',
      c.veg[0] ? { type: 'crop', id: c.veg[0].id } : null);
  }

  // individual crop tiles
  const self = this;
  this.plantings.forEach(function (p) {
    const b = self.spriteBox('crop_' + p.sprite + '_3', p.x, p.y);
    if (!b) return;
    t.push({
      x: b.x, y: b.y, w: b.w, h: b.h,
      tip: p.crop && p.crop.name
        ? p.crop.name + ' — ' + (p.crop.season || '') + ' ' + (p.crop.cat || '') +
          ' · ' + p.label + ', ' + acresText(p.acres)
        : p.label,
      action: p.crop && p.crop.id ? { type: 'crop', id: p.crop.id } : null
    });
  });

  // boundary trees
  if (has('boundary-trees')) {
    const tip = 'Boundary orchard — ' +
      plan.crops.fruit.slice(0, 3).map(function (x) { return x.name; }).join(', ') +
      ' · ' + plan.livestock.trees + ' trees on ' + acresText(plan.acres * 0.10) +
      ', planted on the edge so they cost no cropping land';
    const act = plan.crops.fruit[0] ? { type: 'crop', id: plan.crops.fruit[0].id } : null;
    this.treeSpots().forEach(function (s) {
      const b = self.spriteBox(s.sprite, s.x, s.y);
      if (b) t.push({ x: b.x, y: b.y, w: b.w, h: b.h, tip: tip, action: act });
    });
  }

  // everything standing on the farm
  this.features.forEach(function (o) {
    const b = self.spriteBox(o.sprite, o.x, o.y);
    if (!b || !o.tip) return;
    const entry = { x: b.x, y: b.y, w: b.w, h: b.h, tip: o.tip, action: o.action };
    if (o.kind === 'animal') o.target = entry;   // stepAnimals keeps it in step
    t.push(entry);
  });

  this.targets = t;
};

// stable list of boundary planting positions, shared by render and hit-testing
FarmView.prototype.treeSpots = function () {
  const L = this.layout, F = L.fence;
  const out = [];
  const plan = this.plan;
  let n = 0;
  const pick = function (h) {
    // mostly the fruit this state actually grows, with a few plain trees between
    if (h > 0.30) return orchardSprite(plan, n++);
    return h > 0.15 ? 'tree_small' : 'sapling';
  };
  const top = F.y + 1, bot = F.y + F.h - 2;
  for (let x = 2; x < F.w - 2; x += 4) {
    out.push({ x: x, y: top, sprite: pick(tileHash(x, 1)) });
    // short sprites only along the bottom, so nothing overhangs the fields
    out.push({ x: x + 1, y: bot, sprite: tileHash(x, 55) > 0.5 ? 'tree_small' : 'sapling' });
  }
  for (let y = top + 3; y < bot - 2; y += 4) {
    out.push({ x: 1, y: y, sprite: pick(tileHash(1, y)) });
    out.push({ x: F.w - 2, y: y, sprite: pick(tileHash(88, y)) });
  }
  return out;
};

// canvas pixel -> topmost target
FarmView.prototype.pick = function (px, py) {
  for (let i = this.targets.length - 1; i >= 0; i--) {
    const o = this.targets[i];
    if (px >= o.x && px < o.x + o.w && py >= o.y && py < o.y + o.h) return o;
  }
  return null;
};

FarmView.prototype.resize = function () {
  if (!this.layout) return;
  // measure the scroll viewport, not the frame, which sizes to its content
  let host = this.canvas.parentElement;
  while (host && host.className.indexOf('mapscroll') < 0) host = host.parentElement;
  const box = (host || this.canvas.parentElement).getBoundingClientRect();

  const wpx = this.layout.w * TILE;
  const hpx = this.layout.h * TILE;
  const avail = Math.max(180, box.width - 34);        // less the ruler gutter

  // Scale is a property of the screen, not of the farm: it is worked out from
  // the widest board the game can produce (250 acres), so every farm on a given
  // display uses the same zoom. Otherwise a 5-acre plot would render twice the
  // size of a 10-acre one purely because it happened to fit at 2x. Whole
  // numbers only -- a fractional upscale makes some source pixels double width
  // and the art visibly wobbles.
  const widestBoard = 80 * TILE;
  this.scale = Math.max(1, Math.min(3, Math.floor(avail / widestBoard)));

  this.canvas.width = wpx;
  this.canvas.height = hpx;
  this.canvas.style.width = Math.round(wpx * this.scale) + 'px';
  this.canvas.style.height = Math.round(hpx * this.scale) + 'px';
  this.ctx.imageSmoothingEnabled = false;
};

// --- terrain --------------------------------------------------------------

FarmView.prototype.paintBlob = function (kind, rect) {
  for (let y = 0; y < rect.h; y++) {
    for (let x = 0; x < rect.w; x++) {
      const row = y === 0 ? 't' : (y === rect.h - 1 ? 'b' : 'c');
      const col = x === 0 ? 'l' : (x === rect.w - 1 ? 'r' : 'c');
      this.draw(kind + '_' + row + col, (rect.x + x) * TILE, (rect.y + y) * TILE);
    }
  }
};

FarmView.prototype.paintField = function (rect, wet) {
  const pre = wet ? 'wet' : 'till';
  for (let y = 0; y < rect.h; y++) {
    for (let x = 0; x < rect.w; x++) {
      const col = x === 0 ? 'l' : (x === rect.w - 1 ? 'r' : 'm');
      const alt = (y % 2) ? '2' : '';
      this.draw(pre + '_' + col + alt, (rect.x + x) * TILE, (rect.y + y) * TILE);
    }
  }
};

FarmView.prototype.paintFence = function () {
  const F = this.layout.fence;
  const gate = F.x + Math.floor(F.w / 2);
  const top = F.y, bot = F.y + F.h - 1;
  const p = this.fence;
  const self = this;

  // The wooden fences stand taller than a tile, so they are anchored on the
  // bottom of their tile and allowed to overhang upward, the way the trees and
  // the buildings are. The older 16px set is drawn at the tile origin instead.
  const put = p
    ? function (part, x, y) { self.drawOn(p + part, x, y); }
    : function (part, x, y) { self.draw('fence_' + part, x * TILE, y * TILE); };

  for (let x = F.x; x < F.x + F.w; x++) {
    const part = x === F.x ? 'l' : (x === F.x + F.w - 1 ? 'r' : 'm');
    put(part, x, top);
    if (x !== gate && x !== gate + 1) put(part, x, bot);   // leave the gateway
  }
  for (let y = top + 1; y < bot; y++) {
    put('l', F.x, y);
    put('r', F.x + F.w - 1, y);
  }
};

// --- the farmer -----------------------------------------------------------

FarmView.prototype.stepFarmer = function (dt) {
  const F = this.farmer;
  const fe = this.layout.fence;
  const dx = F.tx - F.x, dy = F.ty - F.y;
  const dist = Math.hypot(dx, dy);

  if (dist < 0.08) {
    F.x = F.tx; F.y = F.ty;
    F.wait -= dt;
    if (F.wait <= 0) {
      const spots = this.features.filter(function (o) { return o.kind === 'building'; });
      let target;
      if (spots.length && Math.random() < 0.6) {
        const o = spots[Math.floor(Math.random() * spots.length)];
        target = { x: o.x + 1, y: o.y + 1 };
      } else {
        target = {
          x: fe.x + 2 + Math.random() * (fe.w - 5),
          y: fe.y + 2 + Math.random() * (fe.h - 5)
        };
      }
      F.tx = Math.max(fe.x + 1.5, Math.min(fe.x + fe.w - 2.5, target.x));
      F.ty = Math.max(fe.y + 1.5, Math.min(fe.y + fe.h - 2.5, target.y));
      F.wait = 0;
      F.act = 'walk';
    } else {
      F.act = F.wait > 900 ? (F.workAct || 'idle') : 'idle';
    }
  } else {
    const speed = 2.6 * dt / 1000;
    F.x += dx / dist * Math.min(speed, dist);
    F.y += dy / dist * Math.min(speed, dist);
    F.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
    F.act = 'walk';
    if (dist < 0.15) {
      F.wait = 1400 + Math.random() * 2200;
      F.workAct = Math.random() < 0.5 ? 'hoe' : 'water';
    }
  }
  F.frame = Math.floor(this.t / 160) % 3;
};

FarmView.prototype.drawFarmer = function () {
  const F = this.farmer;
  const frame = F.act === 'idle' ? 0 : F.frame;
  const key = 'farmer_' + F.act + '_' + F.face + '_' + frame;
  const r = ATLAS[key] || ATLAS['farmer_idle_d_0'];
  if (!r) return;
  this.ctx.drawImage(this.img, r[0], r[1], r[2], r[3],
    Math.round(F.x * TILE + TILE / 2 - r[2] / 2),
    Math.round((F.y + 1) * TILE - r[3]), r[2], r[3]);
};

// --- the frame ------------------------------------------------------------

FarmView.prototype.render = function (dt) {
  if (!this.plan || !this.layout) return;
  this.t += dt;
  const ctx = this.ctx;
  const L = this.layout, F = L.fence;
  const done = this.done;
  const has = function (id) { return done.indexOf(id) >= 0; };
  const self = this;

  ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

  // base grass -- clumped rather than chequered, so it reads as a field
  for (let y = 0; y < L.h; y++) {
    for (let x = 0; x < L.w; x++) {
      const n = tileHash(x, y) * 0.55 +
        tileHash(Math.floor(x / 3), Math.floor(y / 3)) * 0.45;
      this.draw(n > 0.62 ? 'grass_b' : 'grass_a', x * TILE, y * TILE);
    }
  }

  // scrub on the margin, so the edge is not empty lawn
  for (let y = F.y + 1; y < F.y + F.h - 1; y++) {
    for (let x = 1; x < F.w - 1; x++) {
      const inside = x > RING + 1 && x < F.w - RING - 2 &&
        y > F.y + RING + 1 && y < F.y + F.h - RING - 2;
      if (inside) continue;
      const n = tileHash(x + 991, y + 77);
      if (n > 0.94) this.drawOn('shrub', x, y);
      else if (n < 0.03) this.drawOn('rock', x, y);
    }
  }

  // zones as soil patches
  if (has('zones')) {
    this.paintBlob('field', L.blocks.home);
    this.paintBlob('meadow', L.blocks.animals);
  }
  if (has('fodder-plot')) this.paintBlob('meadow', L.blocks.fodder);

  // the pond: Cute Fantasy's water autotile, with its middle tile as the fill
  if (has('pond')) {
    const p = L.blocks.pond;
    for (let y = 1; y < p.h - 1; y++) {
      for (let x = 1; x < p.w - 1; x++) {
        this.draw('water_mid', (p.x + x) * TILE, (p.y + y) * TILE);
      }
    }
    this.paintBlob('water', p);
  }

  // tilled fields. Irrigation shows as the pack's darker watered-soil tiles
  // rather than a drip-lateral sprite, which no pack provides.
  this.fields.forEach(function (f) { self.paintField(f.rect, f.wet); });

  // the house footprint, before the house itself goes up
  if (has('house-start') && !has('house-build')) {
    const b = L.blocks.home;
    for (let x = 0; x < 5; x++) {
      for (let y = 0; y < 3; y++) {
        this.draw(((x + y) % 2) ? 'gravel' : 'stone_bits',
          (b.x + 1 + x) * TILE, (b.y + 1 + y) * TILE);
      }
    }
  }

  // The fence goes down BEFORE anything standing, so the house, the barn and
  // the boundary trees read as being on the farm rather than behind a railing.
  this.paintFence();

  if (has('boundary-trees')) {
    this.treeSpots().forEach(function (s) { self.drawOn(s.sprite, s.x, s.y); });
    const flowers = ['flowers_purple', 'flowers_pink', 'flowers_white', 'sunflower'];
    for (let x = 3; x < F.w - 3; x += 5) {
      const h = tileHash(x, 404);
      this.drawOn(flowers[Math.floor(h * flowers.length) % flowers.length],
        x, F.y + F.h - 3);
    }
  }

  // crops, growing in
  const now = performance.now();
  this.plantings.forEach(function (p) {
    const k = p.x + ',' + p.y + ',' + p.sprite;
    const age = now - (self.plantedAt[k] || now);
    const stage = Math.max(0, Math.min(3, Math.floor(age / GROW_MS)));
    self.drawOn('crop_' + p.sprite + '_' + stage, p.x, p.y);
  });

  // everything standing, back to front
  this.stepAnimals(dt);
  this.features.slice()
    .sort(function (a, b) { return a.y - b.y; })
    .forEach(function (o) {
      if (o.kind === 'animal' && o.face === -1) self.drawOnFlipped(o.sprite, o.x, o.y);
      else self.drawOn(o.sprite, o.x, o.y);
    });

  this.stepFarmer(dt);
  this.drawFarmer();

  // highlight whatever the pointer is over
  if (this.hover) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,248,220,.85)';
    ctx.lineWidth = 1;
    ctx.strokeRect(this.hover.x + .5, this.hover.y + .5, this.hover.w - 1, this.hover.h - 1);
    ctx.restore();
  }

  // No vignette. It tinted the outer grass brown, which read as a border and
  // made the ruler look like it was measuring more ground than the fence holds.
};


/* ===== app.js ==================================================== */
// ---------------------------------------------------------------------------
// Apocalypse Farm -- application shell.
//
// State is three values: acres, state id, and the list of completed step ids.
// Everything on screen is derived from those, so saving and restoring is
// just those three things.
// ---------------------------------------------------------------------------

const SAVE_KEY = 'apocalypse-farm-v1';

const App = {
  acres: 3,
  stateId: null,
  done: [],
  plan: null,
  tab: 'build',
  view: null,
  atlas: null,
  expanded: [],
  // Fixes the look of one farm: which fence style rings it, and which wooden
  // board fronts each area. Saved with the plan, so a farm keeps its fence
  // across reloads, and re-rolled whenever a new farm is started.
  seed: 1,
  auto: { on: false, timer: null, due: 0, paint: null }
};

// --- persistence ----------------------------------------------------------

function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      acres: App.acres, stateId: App.stateId, done: App.done, seed: App.seed
    }));
  } catch (e) { /* private window, or storage disabled -- carry on */ }
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.stateId) return null;
    return d;
  } catch (e) { return null; }
}

// --- small helpers --------------------------------------------------------

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function $(sel) { return document.querySelector(sel); }

function spriteCanvas(name, scale) {
  const r = name && ATLAS[name];
  if (!r) return null;          // no art for this one yet -- caller draws nothing
  const cv = document.createElement('canvas');
  const s = scale || 2;
  cv.width = r[2] * s; cv.height = r[3] * s;
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.drawImage(App.atlas, r[0], r[1], r[2], r[3], 0, 0, r[2] * s, r[3] * s);
  return cv;
}

function findCrop(id) {
  for (let i = 0; i < CROPS.length; i++) if (CROPS[i].id === id) return CROPS[i];
  return null;
}

function findAnimal(id) {
  for (let i = 0; i < ANIMALS.length; i++) if (ANIMALS[i].id === id) return ANIMALS[i];
  return null;
}

function allSteps() {
  const out = [];
  App.plan.steps.forEach(function (p) {
    p.steps.forEach(function (s) { out.push(s); });
  });
  return out;
}

// --- progress meters ------------------------------------------------------

const METERS = [
  {
    key: 'food', label: 'Food security', cls: '',
    parts: {
      'kitchen-garden': 15, 'poultry': 10, 'kharif': 20, 'rabi': 14,
      'pulses': 15, 'dairy': 11, 'fish': 5, 'boundary-trees': 10
    }
  },
  {
    key: 'water', label: 'Water', cls: 'sky',
    parts: { 'water-source': 30, 'rainwater': 25, 'drip': 25, 'pond': 20 }
  },
  {
    key: 'energy', label: 'Energy & fuel', cls: 'gold',
    parts: { 'solar-lighting': 28, 'biogas': 42, 'solar-scale': 30 }
  },
  {
    key: 'soil', label: 'Soil health', cls: '',
    parts: {
      'soil-test': 10, 'compost': 30, 'pulses': 20,
      'fodder-plot': 15, 'boundary-trees': 10, 'drip': 15
    }
  },
  {

    parts: {
      'fence': 15, 'house-start': 10, 'house-build': 30,
      'cattle-shed': 15, 'coop': 0, 'storage': 20, 'machinery': 10
    }
